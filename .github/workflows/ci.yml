# Pipeline CI (T0-03; implement_plan.md mục 10.4 bước 1–3, mục 10.5 quét lỗ hổng phụ thuộc).
# Công cụ CI theo AQ-004; chưa chốt nên dùng GitHub Actions.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — lint, kiểu, quy tắc import, kiểm thử
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Phông DejaVu (sinh PDF kiểm thử tiếng Việt)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-dejavu-core
      - name: Cài phụ thuộc
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check app tests alembic && ruff format --check app tests alembic
      - name: Kiểm tra kiểu (mypy)
        run: mypy
      - name: Quy tắc import (import-linter)
        run: lint-imports
      - name: Unit
        run: pytest tests/unit -q
      - name: Tích hợp và bảo mật (testcontainers — PostgreSQL pgvector, kho S3)
        run: pytest tests/integration tests/security -q
      - name: Migration lên/xuống
        run: pytest tests/integration/test_migrations.py -q -k roundtrip

  frontend:
    name: Frontend — lint, kiểu, kiểm thử, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Lint (eslint)
        run: npm run lint
      - name: Kiểm tra kiểu (tsc)
        run: npm run typecheck
      - name: Kiểm thử (Vitest)
        run: npm test
      - name: Build
        run: npm run build

  evaluation:
    name: Bộ đánh giá — kiểm thử công thức chỉ số
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evaluation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx pytest ruff
      - run: ruff check . && ruff format --check .
      - run: pytest -q
      - name: Chạy thử khung với bộ gọi giả
        run: python run_eval.py --dataset datasets/v1.jsonl --fake --out /tmp/eval

  e2e-typecheck:
    name: E2E — kiểm tra kiểu
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund && npx tsc --noEmit

  openapi-types:
    name: Kiểu TypeScript khớp OpenAPI của backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -e "./backend"
      - run: cd backend && python scripts/export_openapi.py ../frontend/src/api/openapi.json
      - run: cd frontend && npm ci --no-audit --no-fund && npm run gen:api
      - name: Không có thay đổi chưa commit
        run: git diff --exit-code -- frontend/src/api

  dependency-audit:
    name: Quét lỗ hổng phụ thuộc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install pip-audit && pip install -e "./backend"
      - run: pip-audit --skip-editable
      - run: cd frontend && npm ci --no-audit --no-fund && npm audit --audit-level=high

  docker-images:
    name: Build ảnh Docker
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Ảnh backend/worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.backend
          build-args: INSTALL_EXTRAS=embedding
          push: false
          tags: chat-with-docs-backend:ci
      - name: Ảnh frontend (production, nginx)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.frontend.prod
          push: false
          tags: chat-with-docs-frontend:ci
