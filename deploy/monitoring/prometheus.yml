# Thu số liệu của backend (/metrics) và worker (cổng 9100). Hệ thống giám sát chính thức theo AQ-005;
# cấu hình này là mặc định cục bộ (chạy bằng profile "monitoring" của Docker Compose).
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: backend
    metrics_path: /metrics/
    static_configs:
      - targets: ["backend:8000"]
  - job_name: worker
    static_configs:
      - targets: ["worker:9100"]
  # Kiểm tra /health/ready qua blackbox đơn giản: dùng số liệu `up` của backend và luật HealthReadyFailing
