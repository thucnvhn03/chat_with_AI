# Phục vụ frontend tĩnh và chuyển tiếp /api tới backend. TLS kết thúc ở bộ cân bằng tải phía trước
# (theo hạ tầng của tổ chức, AQ-004); cookie phiên luôn có cờ Secure.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Giới hạn thân yêu cầu lớn hơn MAX_FILE_BYTES một chút (multipart có phần đầu)
    client_max_body_size 25m;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Không ghi thân yêu cầu (câu hỏi, tệp) vào log truy cập
        access_log /var/log/nginx/access.log combined;
        proxy_read_timeout 120s;
    }

    location /assets/ {
        # Chỉ dùng `expires`: thêm add_header trong location sẽ làm mất các header bảo mật ở cấp server
        expires 30d;
    }

    # Ứng dụng một trang: mọi đường dẫn khác trả index.html
    location / {
        try_files $uri /index.html;
        expires -1;
    }
}
